services:
  db:
    image: postgres:17-alpine
    container_name: ecommerce_db_container
    env_file:
      - .env
    restart: always
    ports:
      - "5432:5432"
    volumes: 
      - db:/var/lib/postgresql/data
    networks:
      - app 

volumes:
  db:
    driver: local
  cache:
    driver: local

networks:
  app:
    driver: bridge
